name: CI

# Runs on every push to main and on PRs targeting main, so breakage is caught
# automatically instead of manually re-testing each time.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + boot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atelier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Throwaway Postgres — not secret. The signing secrets are GENERATED per run
      # below (never committed) so no key-looking value lives in the repo.
      # 127.0.0.1 (not localhost) to avoid IPv6 ::1 resolution vs the IPv4 port map.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atelier_test
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway CI secrets
        run: |
          # A valid Fernet key = urlsafe-base64 of 32 random bytes. Ephemeral to this run.
          echo "ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (incl. dev)
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Typecheck is the real gate — catches type/import breakage reliably.
      - name: Typecheck
        run: npm run typecheck
      # Lint is informational for now: the repo has pre-existing lint debt, so a
      # blocking gate would always be red. Surfaced but non-blocking until cleaned up.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
